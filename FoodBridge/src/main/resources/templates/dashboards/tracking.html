<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Pickup and delivery tracking')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: alerts}"></div>

<h1 class="h2 section-title mb-1">Pickup and delivery tracking</h1><p class="text-muted">Follow each donation from acceptance to delivery.</p>
<div class="fb-card p-4 mb-3" th:each="t : ${page.content}">
  <div class="d-flex flex-wrap justify-content-between gap-2">
    <div><h2 class="h5 mb-0" th:text="${t.donationName}">Food</h2><div class="text-muted small"><span th:text="${t.quantity} + ' ' + ${t.unit}">5</span> &middot; <span th:text="${t.donorName}">Donor</span> to <span th:text="${t.recipientName}">NGO</span></div></div>
    <div class="small text-muted text-md-end"><div th:if="${t.volunteerName != null}">Volunteer: <strong th:text="${t.volunteerName}">Name</strong></div><div th:if="${t.volunteerName == null and t.status == 'OPEN'}">Waiting for a volunteer</div></div>
  </div>
  <div class="my-3"><div th:replace="~{fragments/layout :: timeline(${t.status})}"></div></div>
  <dl class="row small mb-0">
    <dt class="col-sm-3">Pickup</dt><dd class="col-sm-9" th:text="${t.pickupAddress != null} ? ${t.pickupAddress} : ${t.pickupCity}">addr</dd>
    <dt class="col-sm-3">Drop-off</dt><dd class="col-sm-9" th:text="${t.dropOffAddress != null} ? ${t.dropOffAddress} : ${t.dropOffCity}">addr</dd>
    <dt class="col-sm-3" th:if="${t.assignedAt != null}">Assigned</dt><dd class="col-sm-9" th:if="${t.assignedAt != null}" th:text="${#temporals.format(t.assignedAt, 'dd MMM yyyy HH:mm')}">d</dd>
    <dt class="col-sm-3" th:if="${t.pickedUpAt != null}">Picked up</dt><dd class="col-sm-9" th:if="${t.pickedUpAt != null}" th:text="${#temporals.format(t.pickedUpAt, 'dd MMM yyyy HH:mm')}">d</dd>
    <dt class="col-sm-3" th:if="${t.deliveredAt != null}">Delivered</dt><dd class="col-sm-9" th:if="${t.deliveredAt != null}" th:text="${#temporals.format(t.deliveredAt, 'dd MMM yyyy HH:mm')}">d</dd>
  </dl>
</div>
<div class="empty-state fb-card" th:if="${page.isEmpty()}"><i class="bi bi-truck" aria-hidden="true"></i><p class="mt-2 mb-0">No deliveries to track yet.</p></div>
<div th:replace="~{fragments/layout :: pager(${page}, ${basePath}, ${baseQuery})}"></div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
