<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My donations')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2 section-title mb-0">My donations</h1><a class="btn btn-accent" th:href="@{/donor/donations/new}">Donate food</a></div>
<div class="fb-card" th:if="${!page.isEmpty()}"><div class="table-responsive"><table class="table align-middle mb-0">
  <thead><tr><th>Food</th><th>Left</th><th>Status</th><th>Pickup deadline</th><th></th></tr></thead>
  <tbody><tr th:each="d : ${page.content}">
    <td><a th:href="@{/donations/{id}(id=${d.id})}" th:text="${d.name}">Food</a></td>
    <td th:text="${d.remainingQuantity} + '/' + ${d.quantity} + ' ' + ${d.unit}">1/2</td>
    <td><span class="badge badge-soft" th:text="${d.status}">S</span></td>
    <td th:text="${#temporals.format(d.pickupDeadline, 'dd MMM yyyy HH:mm')}">date</td>
    <td class="text-end">
      <a class="btn btn-sm btn-light" th:href="@{/donor/donations/{id}/edit(id=${d.id})}" th:if="${d.status == 'AVAILABLE' or d.status == 'RESERVED'}">Edit</a>
      <form class="d-inline" th:if="${d.status == 'AVAILABLE' or d.status == 'RESERVED' or d.status == 'EXPIRED'}" th:action="@{/donor/donations/{id}/delete(id=${d.id})}" method="post" data-confirm="Remove this donation?"><button class="btn btn-sm btn-outline-danger" type="submit">Remove</button></form>
    </td></tr></tbody></table></div></div>
<div class="empty-state fb-card" th:if="${page.isEmpty()}"><i class="bi bi-box-seam" aria-hidden="true"></i><p class="mt-2 mb-0">No donations yet.</p></div>
<div th:replace="~{fragments/layout :: pager(${page}, ${basePath}, ${baseQuery})}"></div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
