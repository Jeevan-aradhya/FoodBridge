<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Contact')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="row justify-content-center g-4">
<div class="col-lg-5"><h1 class="section-title">Contact us</h1><p class="text-muted">Questions, feedback or a listing you want us to look at? Send us a message and an administrator will get back to you by email.</p>
<p class="small text-muted mb-0">To report a specific listing, open it and use <em>Report listing</em>.</p></div>
<div class="col-lg-6"><div class="fb-card p-4">
<form th:action="@{/contact}" th:object="${form}" method="post" novalidate>
  <div class="mb-3"><label class="form-label" for="name">Your name</label><input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{name}">e</div></div>
  <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" th:field="*{email}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{email}">e</div></div>
  <div class="mb-3"><label class="form-label" for="message">Message</label><textarea class="form-control" id="message" rows="4" maxlength="400" th:field="*{message}" th:errorclass="is-invalid"></textarea><div class="invalid-feedback" th:errors="*{message}">e</div></div>
  <button class="btn btn-primary" type="submit" data-loading>Send message</button>
</form></div></div></div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
