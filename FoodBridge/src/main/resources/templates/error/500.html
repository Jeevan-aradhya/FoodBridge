<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('500 Something went wrong')}"></head>
<body>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="empty-state fb-card my-5"><i class="bi bi-exclamation-octagon" aria-hidden="true" style="font-size:3rem"></i>
<h1 class="h2 mt-3">Something went wrong</h1><p class="mb-4">An unexpected error happened on our side. Please try again in a moment.</p>
<a class="btn btn-primary" href="/">Back to home</a> <a class="btn btn-outline-primary" href="/donations">Find food</a></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
