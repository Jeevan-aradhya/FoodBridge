<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: alerts}"></div>

<h1 class="h2 section-title mb-3">Audit log</h1>
<div class="fb-card"><div class="table-responsive"><table class="table table-sm align-middle mb-0">
<thead><tr><th>When</th><th>Who</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead>
<tbody><tr th:each="a : ${page.content}"><td class="text-nowrap" th:text="${#temporals.format(a.createdAt, 'dd MMM yyyy HH:mm:ss')}">d</td><td th:text="${a.actorEmail}">who</td><td><code th:text="${a.action}">ACTION</code></td><td th:text="${a.entityType != null} ? ${a.entityType} + ' #' + ${a.entityId} : '-'">e</td><td class="small text-muted" th:text="${a.details}">d</td></tr></tbody></table></div></div>
<div th:replace="~{fragments/layout :: pager(${page}, ${basePath}, ${baseQuery})}"></div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
