<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" class="container py-4">
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="fb-card p-4 p-md-5">
    <h1 class="h3 mb-1">Welcome back</h1>
    <p class="text-muted">Sign in to manage donations, requests and deliveries.</p>
    <div class="alert alert-danger" role="alert" th:if="${param.error}">The email or password is incorrect, or the account is suspended.</div>
    <div class="alert alert-danger" role="alert" th:if="${param.suspended}">Your account has been suspended. Please contact support.</div>
    <div class="alert alert-success" role="status" th:if="${param.logout}">You have been signed out.</div>
    <form th:action="@{/login}" method="post" novalidate>
      <div class="mb-3"><label for="username" class="form-label">Email</label><input id="username" name="username" type="email" class="form-control" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit" data-loading>Sign in</button>
    </form>
    <p class="text-center mt-3 mb-0">New to FoodBridge? <a th:href="@{/register}">Create an account</a></p>
  </div>
</div></div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
