# Development profile: in-memory H2 database, demo data, no MySQL needed.
spring:
  datasource:
    url: jdbc:h2:mem:foodbridge;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  thymeleaf:
    cache: false
foodbridge:
  seed:
    enabled: true
